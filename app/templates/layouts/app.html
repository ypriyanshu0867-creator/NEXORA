{% extends "base.html" %}
{% block body %}
<div class="nx-shell">
  <aside class="nx-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar"
         aria-labelledby="sidebarLabel">
    <div class="nx-sidebar-head">
      <a class="nx-brand" href="{{ url_for('main.index') }}" id="sidebarLabel">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="32" height="32">
        <span class="nx-wordmark">NEXORA</span>
      </a>
      <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
              data-bs-target="#sidebar" aria-label="Close menu"></button>
    </div>
    <nav class="nx-nav" aria-label="Main">
      {% for item in nav_items %}
        {% if item.available %}
          <a class="nx-nav-link{% if item.active %} active{% endif %}" href="{{ item.url }}"
             {% if item.active %}aria-current="page"{% endif %}>
            <i class="bi {{ item.icon }}"></i><span>{{ item.label }}</span>
          </a>
        {% else %}
          <span class="nx-nav-link disabled" aria-disabled="true" title="Not available yet">
            <i class="bi {{ item.icon }}"></i><span>{{ item.label }}</span>
            <span class="badge nx-soon">Soon</span>
          </span>
        {% endif %}
      {% endfor %}
    </nav>
  </aside>

  <div class="nx-main">
    <header class="nx-topbar">
      <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
              data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open menu">
        <i class="bi bi-list"></i>
      </button>
      <div class="ms-auto dropdown">
        <button class="btn nx-user-btn dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
          <span class="nx-avatar" aria-hidden="true">{{ current_user.full_name[:1]|upper }}</span>
          <span class="d-none d-sm-inline text-start">
            <span class="d-block fw-semibold lh-sm">{{ current_user.full_name }}</span>
            <span class="d-block small text-muted lh-sm">{{ role_label }}</span>
          </span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
          <li class="dropdown-header">{{ current_user.email }}</li>
          <li>
            <form method="post" action="{{ url_for('auth.logout') }}" data-loading>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
            </form>
          </li>
        </ul>
      </div>
    </header>
    <main id="main" class="nx-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
